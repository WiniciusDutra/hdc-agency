<div class="hero-section">
  <div class="hero-content fade-in">
    <h1 class="hero-title">Bem-vindo à HDC Agency</h1>
    <p class="hero-subtitle">Gerenciamento de usuários simplificado e intuitivo</p>
    
    <div class="counter-section">
      <div class="counter-display">
        <span class="counter-label">Contador:</span>
        <span class="counter-value">{{ numMostrar }}</span>
      </div>
      <button (click)="adicionarNum()" class="btn btn-primary btn-lg">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Adicionar
      </button>
    </div>
    
    <div class="cta-section">
      <a routerLink="/users" class="btn btn-outline-primary btn-lg">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 6C13 7.65685 11.6569 9 10 9C8.34315 9 7 7.65685 7 6C7 4.34315 8.34315 3 10 3C11.6569 3 13 4.34315 13 6Z" stroke="currentColor" stroke-width="2"/>
          <path d="M5 17C5 14.2386 7.23858 12 10 12C12.7614 12 15 14.2386 15 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Ver Usuários
      </a>
    </div>
  </div>
</div>
