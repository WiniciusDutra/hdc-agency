<div class="user-card">
  <div class="card-avatar">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="18" r="8" stroke="currentColor" stroke-width="2.5"/>
      <path d="M8 40C8 32 15.16 26 24 26C32.84 26 40 32 40 40" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="card-content">
    <h3 class="card-name">{{ user.name }}</h3>
    <div class="card-info">
      <span class="info-badge">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 14C11.3137 14 14 11.3137 14 8C14 4.68629 11.3137 2 8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 5V8L10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        {{ user.age }} anos
      </span>
    </div>
  </div>
  <button (click)="enviarDados()" class="card-action-btn">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M9 3.75V14.25M14.25 9H3.75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Selecionar
  </button>
</div>
